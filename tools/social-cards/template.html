<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guided Childhood social cards</title>
<!--
  The card maker for every Guided Childhood social image. The look is decided in
  brand/GDC_SOCIAL_VISUAL_SYSTEM.md; this file is that system as code. Rebuilt
  5 October 2026 from the approved proposal in brand/proposals/2026-10-05-six-formats.

  Three things make a feed recognisable before anyone reads a word, so they
  never change from card to card:
    1. The frame. Mono eyebrow with the lead's colour dot top left, the page
       count top right, the logo mark bottom left.
    2. The road. The product's own stage road (StageRoad.tsx, butter with a
       dotted trail) with the product's own chunky button shadow. It enters
       every slide at the height the last one left it, so a carousel is one
       continuous road. Characters stand on it.
    3. One lead per deck. A deck names its friend once ("lead": "orbit") and
       every card takes that friend's soft ground, ink and dot, so a series
       is recognised by its colour. Triplets from shared/schools-curriculum.ts.

  Characters are the approved cutouts in public/digi-squad, never generated.
  No stickers, no polka dots, no doodles: those were the Happy News look this
  replaced.
-->
<style>
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;src:url('../../app/fonts/nunito-latin-wght-normal.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;src:url('../../app/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;src:url('../../app/fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;src:url('../../app/fonts/ibm-plex-mono-latin-700-normal.woff2') format('woff2');}

:root{
  /* shared/tokens.css. Never invent a colour. */
  --cream:#F9F8F6; --white:#FFFFFF;
  --ink:#1A1A2E; --ink-soft:#52526A;
  --gold:#EDC35F; --gold-dark:#C99A28; --gold-lt:#FEF7E0;
  --espresso:#2E2818;
  --green:#2F8F6B; --green-dark:#236F52;
  --alert:#C94F3D;
  /* set per card from the lead's triplet */
  --ground:var(--cream); --accent:var(--gold-dark); --lead-ink:var(--ink-soft);
  --m:88px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{background:#8a8a8a;font-family:'Nunito',sans-serif;color:var(--ink);}
#sheet{display:flex;flex-wrap:wrap;align-items:flex-start;gap:40px;padding:40px;}

/* ---------------- the card shell ---------------- */
.card{position:relative;overflow:hidden;background:var(--ground);}
.card.size-portrait{width:1080px;height:1350px;}
.card.size-square{width:1080px;height:1080px;}
.card.size-story{width:1080px;height:1920px;}
.card.size-fb{width:1200px;height:630px;--m:72px;}

/* The serious beat. Once per deck at most. */
.card.tone-ink{--ground:var(--espresso);--accent:var(--gold);--lead-ink:#E8DFC8;color:#FFF9E8;}
.card.tone-ink .count,.card.tone-ink .word{color:#E8DFC8;}

/* ---------------- the frame ---------------- */
.top{position:absolute;left:var(--m);right:var(--m);top:var(--m);z-index:6;
  display:flex;justify-content:space-between;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--lead-ink);}
.size-story .top{top:180px;}
.eyebrow{display:flex;align-items:center;gap:14px;}
.eyebrow i{display:block;width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none;}
.count{font-weight:500;}

.foot{position:absolute;left:var(--m);bottom:72px;z-index:6;display:flex;align-items:center;gap:16px;}
.size-story .foot{bottom:200px;}
.size-fb .foot{bottom:40px;}
.mark{width:46px;height:46px;border-radius:13px;background:var(--gold);box-shadow:0 4px 0 var(--gold-dark);
  display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:10px;flex:none;}
.mark b{display:block;width:5px;border-radius:3px;background:#fff;}
.word{font-weight:800;font-size:28px;letter-spacing:-.01em;color:var(--ink);}

/* the content zone: under the frame, above the road */
.zone{position:absolute;left:var(--m);right:var(--m);top:190px;z-index:4;isolation:isolate;
  display:flex;flex-direction:column;}
.size-story .zone{top:300px;}

/* ---------------- type ---------------- */
.h-xl{font-weight:900;font-size:128px;line-height:.93;letter-spacing:-.035em;}
.h-l {font-weight:900;font-size:96px;line-height:.97;letter-spacing:-.03em;}
.h-m {font-weight:900;font-size:76px;line-height:1.02;letter-spacing:-.025em;}
.h-s {font-weight:900;font-size:58px;line-height:1.05;letter-spacing:-.02em;}
/* the old deck scale names still work */
.h-lg{font-weight:900;font-size:96px;line-height:.97;letter-spacing:-.03em;}
.h-md{font-weight:900;font-size:76px;line-height:1.02;letter-spacing:-.025em;}
.h-sm{font-weight:900;font-size:58px;line-height:1.05;letter-spacing:-.02em;}
.soft{color:var(--lead-ink);}
.tone-ink .soft{color:#CFC5A8;}
.body{font-weight:650;font-size:36px;line-height:1.32;color:var(--lead-ink);max-width:22ch;}
.label{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--lead-ink);}

/* A stretch of the road under the words that carry the idea. Mark them
   with <mark> in the headline. */
mark{background:none;color:inherit;position:relative;white-space:nowrap;}
mark::after{content:'';position:absolute;left:-4px;right:-8px;bottom:-6px;height:16px;border-radius:8px;
  background:var(--gold);box-shadow:0 5px 0 var(--gold-dark);z-index:-1;}

.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:var(--gold);color:var(--ink);
  box-shadow:0 5px 0 var(--gold-dark);border-radius:18px;padding:20px 30px;font-weight:800;font-size:30px;}

/* ---------------- the road and the cast ---------------- */
svg.road{position:absolute;left:0;top:0;pointer-events:none;z-index:2;}
.friend{position:absolute;z-index:3;}

/* ---------------- format pieces ---------------- */
.qmark{font-weight:900;font-size:220px;line-height:.6;color:var(--accent);height:110px;}

.sheet-img{position:absolute;z-index:3;background:#fff;box-shadow:0 24px 50px rgba(26,26,46,.16);
  outline:1px solid rgba(26,26,46,.06);transform:rotate(-2.5deg);}

.phone{position:absolute;z-index:3;width:420px;border-radius:52px;background:var(--ink);padding:16px;
  box-shadow:0 30px 60px rgba(26,26,46,.22);}
.phone img{display:block;width:100%;border-radius:38px;}

.steps .label{margin-bottom:14px;}
.steps .h-s{margin-bottom:46px;}
.steps .how{color:var(--gold-dark);}

/* passport cover, from components/pathway/PassportBook.tsx, no child's name */
.passport{position:absolute;z-index:3;width:300px;height:420px;border-radius:14px 18px 18px 14px;
  background:linear-gradient(160deg,#6B2333 0%,#571C2A 55%,#4A1723 100%);
  box-shadow:inset 0 0 0 2px rgba(237,195,95,.55),inset 0 0 0 5px rgba(237,195,95,.14),inset 12px 0 24px rgba(0,0,0,.25),0 18px 40px rgba(26,26,46,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:34px 22px 26px;text-align:center;}
.passport .t{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);}
.passport .rule{width:46px;height:1.5px;background:rgba(237,195,95,.55);margin:9px auto 0;}
.crest{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;border:2.5px solid rgba(237,195,95,.85);
  box-shadow:inset 0 0 0 4px rgba(237,195,95,.18);display:flex;align-items:center;justify-content:center;}
.crest div{display:flex;align-items:flex-end;gap:4.5px;height:34px;}
.crest b{display:block;width:6px;border-radius:3px;background:var(--gold);}
.passport .n{font-weight:900;font-size:30px;color:var(--gold);}
.passport .s{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,195,95,.65);margin-top:6px;}
.chips{display:flex;gap:7px;}
.chips span{width:34px;height:34px;border-radius:50%;background:#FFF7E8;border:1.5px solid var(--gold);overflow:hidden;display:flex;}
.chips img{width:100%;height:100%;object-fit:contain;}

/* say this, not this: the highest saving format, a sentence for tonight */
.lines{display:flex;flex-direction:column;gap:30px;}
.line{border-radius:30px;padding:36px 40px;}
.line .tag{display:block;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;}
.line p{font-weight:800;font-size:44px;line-height:1.2;letter-spacing:-.01em;}
.line.not{background:rgba(26,26,46,.05);}
.line.not .tag{color:var(--ink-soft);} .line.not p{color:var(--ink-soft);}
.line.say{background:var(--white);box-shadow:0 5px 0 var(--gold-dark);outline:2px solid var(--gold);}
.line.say .tag{color:var(--gold-dark);}
.tone-ink .line.not{background:rgba(255,255,255,.07);} .tone-ink .line.not p,.tone-ink .line.not .tag{color:#CFC5A8;}
.tone-ink .line.say p{color:var(--ink);}

/* one moment, three ages, each in its friend's own colour */
.bands{display:flex;flex-direction:column;gap:24px;}
.band{display:flex;align-items:stretch;background:var(--white);border-radius:26px;overflow:hidden;box-shadow:0 4px 24px rgba(26,26,46,.07);}
.band .age{flex:none;width:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 8px;text-align:center;}
.band .age img{width:74px;height:74px;object-fit:contain;}
.band .age b{font-weight:900;font-size:30px;line-height:1;}
.band .age small{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;}
.band .what{padding:22px 30px 22px 26px;display:flex;align-items:center;}
.band .what p{font-weight:700;font-size:32px;line-height:1.28;color:var(--ink);}

/* a counted list: only when the number is true (five good things) */
.items{display:flex;flex-direction:column;gap:30px;}
.item{display:flex;gap:26px;align-items:flex-start;}
.item .n{flex:none;width:64px;height:64px;border-radius:18px;background:var(--gold);box-shadow:0 4px 0 var(--gold-dark);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;color:var(--ink);}
.item .t{font-weight:700;font-size:36px;line-height:1.3;color:var(--ink);padding-top:8px;}

.stat{font-weight:900;font-size:260px;line-height:.85;letter-spacing:-.04em;}
.stat small{font-size:90px;letter-spacing:-.02em;}

.frame{background:var(--white);padding:22px 22px 84px;box-shadow:0 24px 50px rgba(26,26,46,.14);transform:rotate(-1.6deg);position:relative;}
.frame .slot{width:100%;aspect-ratio:4/3;background:var(--gold-lt);display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark);text-align:center;padding:24px;background-size:cover;background-position:center;}
.frame .cap{position:absolute;left:22px;right:22px;bottom:24px;font-weight:800;font-size:32px;color:var(--ink);text-align:center;}
</style>
</head>
<body>
<div id="sheet"></div>

<script>
/* ------------------------------------------------------------------
   Data in, cards out. render.mjs injects a deck and calls renderDeck.
   Open this file in a browser to see SAMPLE and design by eye.

   Image paths in a deck are relative to the repo root
   ("public/printables/earn-your-screen-time.png"). Only real assets:
   approved cutouts, real screenshots, real printable pages.
   ------------------------------------------------------------------ */

const ROOT = '../../';

/* Friend triplets, shared/schools-curriculum.ts, and the approved art. */
const LEADS = {
  pebble: { accent:'#C99A28', soft:'#FBEED0', ink:'#7A5A0E', art:'public/digi-squad/friends/pebble.png' },
  bloop:  { accent:'#6C9E38', soft:'#E4F0D4', ink:'#3F5E1E', art:'public/digi-squad/friends/bloop.png' },
  orbit:  { accent:'#3E86BC', soft:'#DCEBF7', ink:'#1F4E6E', art:'public/digi-squad/friends/orbit.png' },
  nova:   { accent:'#7E5AB0', soft:'#ECE3F7', ink:'#4A2F73', art:'public/digi-squad/friends/nova.png' },
  cosmo:  { accent:'#CE7328', soft:'#FBE4D0', ink:'#8F4A12', art:'public/digi-squad/friends/cosmo.png' },
  digi:   { accent:'#C99A28', soft:'#FDF4D9', ink:'#7A5A0E', art:'public/digi-squad/DiGi-star.svg' },
};
const CAST = [
  { key:'pebble', ages:'4 to 7',   stage:'Foundation' },
  { key:'bloop',  ages:'8 to 10',  stage:'Builder' },
  { key:'orbit',  ages:'11 to 13', stage:'Explorer' },
  { key:'nova',   ages:'13 to 15', stage:'Shaper' },
  { key:'cosmo',  ages:'16+',      stage:'Independent' },
];
/* An age band names its friend, or the friend is read from the age. */
function friendForAge(age){
  const a = String(age || '');
  if (/^4\b/.test(a)) return 'pebble';
  if (/^8\b/.test(a)) return 'bloop';
  if (/^11\b/.test(a)) return 'orbit';
  if (/^13\b/.test(a)) return 'nova';
  if (/16/.test(a)) return 'cosmo';
  return null;
}

const SIZES = { portrait:[1080,1350], square:[1080,1080], story:[1080,1920], fb:[1200,630] };

/* Which formats stand the lead on the road by default: the cover, the
   question, the situation and the last card. One friend per deck, seen at
   the start and the end, not on every slide. "friend": true adds it. */
const SHOWS_FRIEND = ['hook','cover','question','situation','ask','cta'];

const MARK = `<div class="mark"><b style="height:9px"></b><b style="height:16px"></b><b style="height:24px"></b><b style="height:14px"></b></div>`;

/* The road. Every slide enters at the height the last one left at (roadY),
   so a swipe reads as one road. The wave alternates by slide. */
function roadPath(W, H, i){
  const y = H - 200, a = (i % 2 ? -1 : 1) * 46;
  return `M-40 ${y} C ${W*0.28} ${y + a}, ${W*0.62} ${y - a}, ${W + 40} ${y}`;
}
function roadSVG(W, H, d, ground){
  return `<svg class="road" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><g fill="none" stroke-linecap="round">
    <path d="${d}" stroke="#C99A28" stroke-width="44" transform="translate(0 7)"/>
    <path class="road-line" d="${d}" stroke="#EDC35F" stroke-width="44"/>
    <path d="${d}" stroke="${ground}" stroke-width="5" stroke-dasharray="2 26"/>
  </g></svg>`;
}

function passportHTML(style){
  return `<div class="passport" style="${style}">
    <div><div class="t">Digital Childhood Passport</div><div class="rule"></div></div>
    <div><div class="crest"><div><b style="height:12px"></b><b style="height:22px"></b><b style="height:34px"></b><b style="height:19px"></b></div></div>
      <div class="n">Our family</div><div class="s">The journey to 16</div></div>
    <div class="chips">${CAST.map(c => `<span><img src="${ROOT + LEADS[c.key].art}"></span>`).join('')}</div>
  </div>`;
}

function inner(c, ctx){
  const L = ctx.lead;
  switch (c.type) {

  /* 1 · BIG STAT OR HOOK. Very little copy. Mark the words that carry it. */
  case 'hook':
  case 'cover':
    return `<div class="${c.scale || 'h-xl'}">${c.headline}</div>
      ${c.second ? `<div class="${c.scale || 'h-xl'} soft" style="margin-top:58px">${c.second}</div>` : ''}
      ${c.body ? `<p class="body" style="margin-top:44px">${c.body}</p>` : ''}`;

  case 'stat':
    return `<div class="stat">${c.value}${c.unit ? `<small>${c.unit}</small>` : ''}</div>
      ${c.body ? `<p class="body" style="margin-top:48px">${c.body}</p>` : ''}`;

  /* 2 · CHARACTER AND QUESTION. Orbit asks, DiGi what do I say. */
  case 'question':
    return `<div class="${c.scale || 'h-l'}" style="max-width:${c.wide ? 'none' : '880px'}">${c.headline}</div>
      ${c.body ? `<p class="body" style="margin-top:40px">${c.body}</p>` : ''}`;

  /* 3 · PRINTABLE OR OFFLINE. The real page is the hero. */
  case 'printable':
    return `<div class="${c.scale || 'h-m'}">${c.headline}</div>`;

  /* 4 · PRODUCT SCREEN. Problem, the move, how we help. A real screenshot. */
  case 'screen': {
    const s = c.steps || [];
    const tag = ['The problem','The move','How we help'];
    return `<div class="steps" style="max-width:${ctx.W - 2*88 - 470}px">
      ${s.map((t, n) => `<div class="label ${n === 2 ? 'how' : ''}">${tag[n] || ''}</div><div class="h-s">${t}</div>`).join('')}
    </div>`;
  }

  /* 5 · AGE STAGE AND JOURNEY. The road to 16. */
  case 'road':
    return `<div class="${c.scale || 'h-l'}">${c.headline}${c.second ? `<br><span class="soft">${c.second}</span>` : ''}</div>`;

  /* 6 · PARENT SITUATION. Illustrative, and it says so in the eyebrow. */
  case 'situation':
    return `<div class="qmark">&ldquo;</div>
      <div class="${c.scale || 'h-xl'}" style="font-size:${c.scale ? '' : '118px'}">${c.quote}</div>
      ${c.turn ? `<p class="body" style="margin-top:44px;font-size:40px">${c.turn}</p>` : ''}
      ${c.pill ? `<div style="margin-top:48px"><span class="pill">${c.pill}</span></div>` : ''}`;

  /* The supporting slides inside a carousel. */
  case 'text':
  case 'big':
    return `<div class="${c.scale || (c.type === 'big' ? 'h-l' : 'h-m')}">${c.headline}</div>
      ${c.body ? `<p class="body" style="margin-top:40px">${c.body}</p>` : ''}
      ${c.pill ? `<div style="margin-top:48px"><span class="pill">${c.pill}</span></div>` : ''}`;

  case 'quote':
    return `<div class="qmark">&ldquo;</div>
      <div class="${c.scale || 'h-m'}">${c.quote}</div>
      ${c.attrib ? `<p class="body" style="margin-top:44px">${c.attrib}</p>` : ''}`;

  case 'script':
    return `${c.headline ? `<div class="${c.scale || 'h-s'}" style="margin-bottom:44px">${c.headline}</div>` : ''}
      <div class="lines">
        <div class="line not"><span class="tag">Not this</span><p>${c.not}</p></div>
        <div class="line say"><span class="tag">Say this</span><p>${c.say}</p></div>
      </div>`;

  case 'ages':
    return `${c.headline ? `<div class="${c.scale || 'h-s'}" style="margin-bottom:40px">${c.headline}</div>` : ''}
      <div class="bands">${(c.bands || []).map(b => {
        const f = LEADS[b.friend || friendForAge(b.age)] || LEADS.digi;
        return `<div class="band"><div class="age" style="background:${f.soft};color:${f.ink}">
          <img src="${ROOT + f.art}"><b>${b.age}</b><small>${b.stage || ''}</small></div>
          <div class="what"><p>${b.what}</p></div></div>`;
      }).join('')}</div>`;

  case 'list':
    return `${c.headline ? `<div class="${c.scale || 'h-s'}" style="margin-bottom:44px">${c.headline}</div>` : ''}
      <div class="items">${(c.items || []).map((t, n) => `<div class="item"><span class="n">${n + 1}</span><span class="t">${t}</span></div>`).join('')}</div>`;

  case 'photo':
    return `<div class="frame" style="margin-top:40px">
        <div class="slot" ${c.image ? `style="background-image:url('${ROOT + c.image}');color:transparent"` : ''}>${c.slot || 'Drop the photo here'}</div>
        <div class="cap">${c.caption || ''}</div></div>`;

  /* The last slide: saves and sends. The product ask lives in the caption. */
  case 'ask':
    return `<div class="${c.scale || 'h-m'}" style="margin-bottom:44px">${c.headline || 'Keep this one'}</div>
      <div class="lines">
        <div class="line say"><span class="tag">Save it</span><p>${c.save}</p></div>
        <div class="line say" style="box-shadow:0 5px 0 ${L.accent};outline-color:${L.accent}"><span class="tag" style="color:${L.accent}">Send it</span><p>${c.send}</p></div>
      </div>`;

  case 'cta':
    return `<div class="${c.scale || 'h-m'}">${c.headline}</div>
      ${c.body ? `<p class="body" style="margin-top:40px">${c.body}</p>` : ''}
      <div style="margin-top:48px"><span class="pill">${c.pill || 'Link in bio'}</span></div>`;
  }
  return `<div class="h-m">Unknown card type: ${c.type}</div>`;
}

/* Pieces that sit outside the content zone, positioned on the card. */
function extras(c, ctx){
  const { W, H } = ctx;
  if (c.type === 'printable' && c.image)
    return `<img class="sheet-img" src="${ROOT + c.image}" style="width:${c.width || 500}px;left:${(W - (c.width || 500)) / 2 + 20}px;top:430px">`;
  if (c.type === 'screen' && c.image)
    return `<div class="phone" style="right:80px;top:190px"><img src="${ROOT + c.image}"></div>
      ${c.caption ? `<div class="label" style="position:absolute;right:88px;top:${H - 300}px;text-align:right;font-size:17px;z-index:4">${c.caption}</div>` : ''}`;
  if (c.type === 'road')
    return passportHTML(`left:${W - 280}px;top:${H - 880}px;transform:rotate(4deg) scale(.72);transform-origin:top left`) + `<div class="cast"></div>`;
  return '';
}

function cardHTML(c, i, deck){
  const total = deck.cards.length;
  const size = c.size || deck.size || 'portrait';
  const [W, H] = SIZES[size] || SIZES.portrait;
  const leadKey = c.lead === undefined ? deck.lead : c.lead;
  const lead = LEADS[leadKey] || null;
  const ink = c.tone === 'ink';
  const cream = c.ground === 'cream' || deck.ground === 'cream' || !lead;
  const ground = ink ? '#2E2818' : cream ? '#F9F8F6' : lead.soft;
  const L = lead || { accent:'#C99A28', ink:'#52526A' };
  const ctx = { W, H, lead: L };

  const vars = ink ? '' : `--ground:${ground};--accent:${L.accent};--lead-ink:${cream && !lead ? '#52526A' : L.ink};`;

  /* the road: its own climb on the journey card, the shared wave elsewhere */
  const d = c.type === 'road'
    ? `M-40 ${H - 210} C 140 ${H - 210}, 220 ${H - 265}, 340 ${H - 285} S 520 ${H - 325}, 600 ${H - 415} S 700 ${H - 560}, ${W - 240} ${H - 590}`
    : roadPath(W, H, i);

  const showFriend = lead && c.friend !== false && (c.friend === true || SHOWS_FRIEND.includes(c.type));
  const friendW = c.friendSize || (c.type === 'question' ? 460 : 400);
  const friend = showFriend
    ? `<img class="friend on-road" data-x="${W - 90 - friendW / 2}" data-w="${friendW}" src="${ROOT + lead.art}" style="width:${friendW}px">`
    : '';

  const showCount = total > 1 && deck.numbered !== false;
  const right = c.tag || (showCount ? `${i + 1} / ${total}` : '');

  return `<div class="card size-${size} ${ink ? 'tone-ink' : ''}" style="${vars}" data-name="${c.name || 'card-' + (i + 1)}" data-type="${c.type}">
    <div class="top"><div class="eyebrow"><i></i>${c.eyebrow || deck.eyebrow || ''}</div><div class="count">${right}</div></div>
    <div class="zone">${inner(c, ctx)}</div>
    ${roadSVG(W, H, d, ground)}
    ${extras(c, ctx)}
    ${friend}
    <div class="foot">${MARK}<div class="word">${deck.wordmark || 'Guided Childhood'}</div></div>
  </div>`;
}

/* After layout: stand every friend on the road, wherever the curve is. */
function placeOnRoad(card){
  const path = card.querySelector('.road-line');
  if (!path) return;
  const L = path.getTotalLength();
  const pointAtX = (x) => {
    let lo = 0, hi = L;
    for (let k = 0; k < 30; k++) { const mid = (lo + hi) / 2; if (path.getPointAtLength(mid).x < x) lo = mid; else hi = mid; }
    return path.getPointAtLength(lo);
  };
  card.querySelectorAll('img.on-road').forEach(img => {
    const x = +img.dataset.x, w = +img.dataset.w, p = pointAtX(x);
    const h = w * (img.naturalHeight / img.naturalWidth || 1);
    img.style.left = (x - w / 2) + 'px';
    img.style.top = (p.y - h * 0.93) + 'px';
  });
  const cast = card.querySelector('.cast');
  if (cast) {
    const at = [.24, .40, .55, .72, .88], w = 150;
    cast.innerHTML = CAST.map((c, n) => {
      const p = path.getPointAtLength(L * at[n]), f = LEADS[c.key];
      return `<img class="friend" src="${ROOT + f.art}" style="width:${w}px;left:${p.x - w / 2}px;top:${p.y - w + 14}px">
        <div class="label" style="position:absolute;z-index:4;left:${p.x - 80}px;width:160px;text-align:center;top:${p.y - w - 12}px;color:${f.accent};font-size:19px">${c.ages}</div>`;
    }).join('');
  }
}

async function renderDeck(deck){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = deck.cards.map((c, i) => cardHTML(c, i, deck)).join('');
  await Promise.all([...sheet.querySelectorAll('img')].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
  sheet.querySelectorAll('.card').forEach(placeOnRoad);
}

const SAMPLE = {
  name: 'sample',
  lead: 'orbit',
  cards: [
    { type:'question', eyebrow:'Orbit asks', headline:"If an AI answer sounds sure of itself, how would you know it's wrong?", body:'Ask it at tea tonight. Swipe for three ways to check.' },
    { type:'road', lead:null, eyebrow:'The road to 16', headline:'Every age has a job.', second:'Here is the road.' },
    { type:'situation', lead:'nova', eyebrow:'A thing parents say', quote:'Everyone else has Snapchat.', turn:'What would you say next?', pill:'Swipe for the words &rarr;' },
  ],
};

window.renderDeck = renderDeck;
if (window.DECK) renderDeck(window.DECK); else renderDeck(SAMPLE);
</script>
