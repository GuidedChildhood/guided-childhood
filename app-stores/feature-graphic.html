<!doctype html>
<!--

  scripts/app-stores/render-feature-graphic.mjs. Built only from approved

-->
<html lang="en-GB"><head><meta charset="utf-8">
<style>

  @font-face { font-family: Plex; src: url(../app/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); font-weight: 600; }

  .text { position: absolute; left: 64px; top: 96px; width: 530px; }
  .eyebrow { font-family: Plex, monospace; font-weight: 600; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: #52526A; margin-bottom: 18px; }

  p { font-weight: 600; font-size: 23px; line-height: 1.35; margin: 0; color: #52526A; }
  .disc { position: absolute; right: 64px; top: 90px; width: 320px; height: 320px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 8px 0 #EDC35F; }
  .digi { position: absolute; right: 99px; top: 112px; width: 250px; }
</style></head>
<body><div class="card">
  <div class="text">
    <div class="eyebrow">Guided Childhood</div>

    <p>Ten minutes a day, parent and child together, with the actual words for the hard bits.</p>
