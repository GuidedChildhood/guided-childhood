<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Printed Passport listing images</title>
<link href="../fonts/local-fonts.css" rel="stylesheet">
<!--
  Etsy photo slots for the printed Passport, 2000 by 2000. Every page and
  sticker shown is the real render of printed.html (images/preview/printed,
  trimmed to the A6 page), laid out as a render, never a generated photo of a
  booklet that does not exist yet. When the Mixam proof arrives, a real photo
  of it in a hand (no face) goes in slot 1 and this cover moves down.
  The sample name is Sam: never a real child's name in a public asset.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Nunito',sans-serif;background:#bbb;color:#1A1A2E;}
  .frame{width:2000px;height:2000px;position:relative;overflow:hidden;background:#F9F8F6;margin-bottom:40px;}
  .mono{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;}
  .eyebrow{font-size:34px;color:#C99A28;display:flex;align-items:center;gap:16px;}
  .eyebrow::before{content:'';width:16px;height:16px;border-radius:50%;background:#EDC35F;display:inline-block;}
  h1{font-weight:900;font-size:128px;line-height:0.98;letter-spacing:-3.5px;margin-top:28px;}
  .sub{font-weight:700;font-size:46px;color:#52526A;margin-top:30px;line-height:1.3;}
  .pg{display:block;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,0.08), 0 30px 60px rgba(26,26,46,0.22);}
  .pill{font-weight:800;font-size:38px;background:#fff;border:5px solid #1A1A2E;border-radius:999px;box-shadow:0 8px 0 #1A1A2E;padding:18px 40px;display:inline-block;}
  .foot{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:27px;color:#8888A0;}
  .head{position:absolute;left:130px;top:140px;z-index:5;}
</style>
</head>
<body>
<script src="../passport-data.js"></script>
<script>
(() => {
const S = window.PASSPORT.stages
const pg = n => `../images/preview/printed/p${String(n).padStart(2, '0')}.png`
const st = n => `../images/preview/printed/sticker-${String(n).padStart(2, '0')}.png`
const NAMED = '../images/preview/printed/p01-named.png'
const foot = '<div class="foot mono">Printed and posted · Guided Childhood</div>'
const road = d => `<svg viewBox="0 0 2000 2000" style="position:absolute;inset:0;width:2000px;height:2000px;"><path d="${d}" fill="none" stroke="#EDC35F" stroke-width="70" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#FFF6DE" stroke-width="7" stroke-dasharray="34 30" stroke-linecap="round"/></svg>`
// A6 is 105 by 148, so a page w wide is w * 1.41 tall.
const H = w => Math.round(w * 148 / 105)
// An open spread: two real pages meeting at a soft gutter shadow.
const spread = (l, r, w) => `<div style="display:flex;position:relative;border-radius:12px;box-shadow:0 34px 70px rgba(26,26,46,0.25);">
  <img src="${pg(l)}" style="width:${w}px;height:${H(w)}px;display:block;border-radius:12px 0 0 12px;">
  <img src="${pg(r)}" style="width:${w}px;height:${H(w)}px;display:block;border-radius:0 12px 12px 0;">
  <div style="position:absolute;left:${w - 60}px;top:0;width:120px;height:100%;background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(42,31,20,0.16) 48%,rgba(42,31,20,0.22) 50%,rgba(42,31,20,0.16) 52%,rgba(0,0,0,0) 100%);"></div>
</div>`
const out = []

// 1 · THE COVER: the named book, the sticker sheet behind it, Pebble.
out.push(`<div class="frame" data-name="p01-printed-cover">
  ${road('M -60 1720 C 420 1600, 760 1840, 1180 1690 S 1820 1420, 2080 1500')}
  <div class="head">
    <div class="mono eyebrow">Made to order · Ages 4 to 16</div>
    <h1>The Passport,<br>printed and<br>posted</h1>
    <div class="sub">Their name on the cover.<br>Real stickers for<br>every stamp.</div>
  </div>
  <img class="pg" src="${pg(17)}" style="position:absolute;right:110px;top:230px;width:660px;height:${H(660)}px;transform:rotate(7deg);">
  <img class="pg" src="${NAMED}" style="position:absolute;right:400px;top:640px;width:800px;height:${H(800)}px;transform:rotate(-6deg);">
  <img src="../images/friends/pebble.png" style="position:absolute;left:120px;top:1300px;width:520px;height:520px;object-fit:contain;">
  ${foot}
</div>`)

// 2 · ONE SPREAD PER STAGE, open at Pebble with the stamp in.
out.push(`<div class="frame" data-name="p02-printed-spread" style="display:flex;flex-direction:column;align-items:center;padding-top:140px;">
  <div class="mono eyebrow">Inside</div>
  <h1 style="text-align:center;font-size:112px;">A spread for every stage</h1>
  <div class="sub" style="text-align:center;margin-top:24px;">The talk, the doing and the check on the left.<br>The stamp on the right, once all three are done.</div>
  <div style="position:relative;margin-top:70px;">
    ${spread(4, 5, 860)}
    <img src="${st(1)}" style="position:absolute;left:${860 + 430 - 155}px;top:${Math.round(37 / 148 * H(860)) - 155}px;width:310px;height:310px;transform:rotate(-4deg);filter:drop-shadow(0 6px 6px rgba(0,0,0,0.18));">
  </div>
  ${foot}
</div>`)

// 3 · EVERY PAGE.
out.push(`<div class="frame" data-name="p03-printed-pages" style="display:flex;flex-direction:column;align-items:center;padding-top:140px;">
  <div class="mono eyebrow">Every page</div>
  <h1 style="text-align:center;font-size:112px;">16 pages, A6, stapled</h1>
  <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:44px 22px;margin-top:110px;">
    ${Array.from({ length: 16 }, (_, i) => `<img class="pg" src="${pg(i + 1)}" style="width:210px;height:${H(210)}px;border-radius:6px;">`).join('')}
  </div>
  <div style="display:flex;gap:26px;margin-top:120px;">
    <span class="pill">Five Planet Friends</span><span class="pill">Words to say</span><span class="pill">Draw your photo</span>
  </div>
  ${foot}
</div>`)

// 4 · THE STICKERS.
out.push(`<div class="frame" data-name="p04-printed-stickers">
  <div class="head">
    <div class="mono eyebrow">In the envelope</div>
    <h1>Real stickers<br>for every stamp</h1>
    <div class="sub">Five stage stamps, the Passport<br>complete seal, a name label<br>and fourteen DiGi stars.</div>
  </div>
  <img class="pg" src="${pg(17)}" style="position:absolute;left:170px;top:780px;width:700px;height:${H(700)}px;transform:rotate(-4deg);">
  <div style="position:absolute;right:150px;top:560px;transform:rotate(4deg);">
    <img class="pg" src="${pg(9)}" style="width:820px;height:${H(820)}px;">
    <img src="${st(3)}" style="position:absolute;left:${410 - 150}px;top:${Math.round(37 / 148 * H(820)) - 150}px;width:300px;height:300px;transform:rotate(-10deg);filter:drop-shadow(0 6px 6px rgba(0,0,0,0.18));">
  </div>
  ${foot}
</div>`)

// 5 · THE NAME: printed for you, or theirs to write.
out.push(`<div class="frame" data-name="p05-printed-name" style="display:flex;flex-direction:column;align-items:center;padding-top:140px;">
  <div class="mono eyebrow">Personalised, if you like</div>
  <h1 style="text-align:center;font-size:112px;">Their name in gold,<br>or theirs to write</h1>
  <div style="display:flex;gap:120px;margin-top:90px;align-items:flex-start;">
    ${[[NAMED, 'Add their first name at checkout'], [pg(1), 'Or leave it blank. Writing it is the first stamp of the journey']].map(([src, t]) => `<div style="width:620px;display:flex;flex-direction:column;align-items:center;">
      <img class="pg" src="${src}" style="width:620px;height:${H(620)}px;">
      <div style="font-weight:800;font-size:40px;text-align:center;margin-top:46px;line-height:1.3;">${t}</div>
    </div>`).join('')}
  </div>
  ${foot}
</div>`)

// 6 · HOW IT ARRIVES.
out.push(`<div class="frame" data-name="p06-printed-delivery" style="display:flex;flex-direction:column;align-items:center;padding-top:140px;">
  <div class="mono eyebrow">How it arrives</div>
  <h1 style="text-align:center;font-size:112px;">Printed one at a time<br>in the UK</h1>
  <div class="sub" style="text-align:center;">Made to order for your child, then posted to your door.</div>
  <div style="display:flex;gap:70px;margin-top:90px;align-items:center;">
    <img class="pg" src="${NAMED}" style="width:520px;height:${H(520)}px;transform:rotate(-5deg);">
    <div style="display:flex;flex-direction:column;gap:30px;align-items:flex-start;">
      <span class="pill">A6, pocket size</span>
      <span class="pill">16 full colour pages</span>
      <span class="pill">Stapled, soft cover</span>
      <span class="pill">Sticker sheet included</span>
      <span class="pill" style="background:#FFF6DE;">Ages 4 to 16</span>
    </div>
  </div>
  ${foot}
</div>`)

document.body.insertAdjacentHTML('beforeend', out.join('\n'))
})()
</script>
</body>
</html>
