<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Part 1 card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F0E4;--ink:#232019;--accent:#B4552F;--taupe:#9B7E63;--rule:rgba(35,32,25,0.16);
--display:"Playfair Display", Georgia, "Times New Roman", serif;--body:"Source Serif 4", Georgia, serif;}
html,body{margin:0;background:#d9d2c4;display:flex;justify-content:center;padding:0;}
.card{width:1080px;height:1350px;box-sizing:border-box;background:var(--cream);color:var(--ink);
padding:110px 100px;display:flex;flex-direction:column;font-family:var(--body);}
.eyebrow{font-family:var(--body);text-transform:uppercase;letter-spacing:.28em;font-size:22px;color:var(--taupe);font-weight:600;text-align:center;margin:0 0 34px;}
.headline{font-family:var(--display);font-weight:800;color:var(--ink);font-size:78px;line-height:1.05;text-align:center;margin:0 0 40px;letter-spacing:-0.5px;}
.rule{height:1px;background:var(--rule);width:70%;margin:6px auto 60px;}
.hero{font-family:var(--display);font-weight:700;color:var(--accent);font-size:150px;line-height:1;text-align:center;margin:10px 0 46px;letter-spacing:-1px;}
.caption{font-family:var(--body);font-size:33px;line-height:1.5;color:var(--ink);text-align:center;margin:0 auto 66px;max-width:80%;}
.bars{display:flex;flex-direction:column;gap:30px;margin:0 0 60px;}
.bar-row{display:flex;align-items:center;gap:22px;}
.bar-label{font-family:var(--body);font-size:26px;color:var(--ink);width:360px;text-align:right;flex:none;}
.bar-track{flex:1;display:flex;align-items:center;gap:18px;}
.bar{height:38px;border-radius:3px;}
.bar.big{background:var(--ink);}.bar.small{background:var(--accent);}
.bar-val{font-family:var(--display);font-weight:700;font-size:30px;color:var(--ink);}
.kicker{font-family:var(--body);font-style:italic;font-size:34px;color:var(--ink);text-align:center;margin:14px 0 auto;}
.footer{font-family:var(--body);font-size:24px;color:var(--accent);text-align:center;margin:40px 0 0;letter-spacing:.02em;}
</style></head><body><div class="card"><p class="eyebrow">Follow the Money, Part 1 of 6</p><h1 class="headline">The Fines That<br>Worked Cost Nothing</h1><div class="rule"></div><div class="hero">$0</div><p class="caption">Microsoft, 2001. No fine. A conduct decree that changed an industry.</p><div class="bars"><div class="bar-row"><div class="bar-label">Record privacy fine, 2019</div><div class="bar-track"><div class="bar big" style="width:78%"></div><div class="bar-val">$5bn</div></div></div><div class="bar-row"><div class="bar-label">Behaviour it changed</div><div class="bar-track"><div class="bar small" style="width:2%"></div><div class="bar-val">$0</div></div></div></div><p class="kicker">113 years of cases. One pattern.</p><p class="footer">The Guided Digital Childhood, guidedchildhood.com</p></div></body></html>
