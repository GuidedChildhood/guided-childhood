  <script>
    (function () {
      var FRAME_ID = "03-the-real-thing";
      var q = function (sel) { return document.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

      var cardLeft = q("#rt03-card-left");
      var cardRight = q("#rt03-card-right");
      var pillStars = q("#rt03-pill-stars");
      var pillPassport = q("#rt03-pill-passport");
      var words = qa(".rt03-word");
      var ornaments = qa(".rt03-orn");

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0 to 0.9s): split-tilt-cards.
         Each screen slides in from its own wing with a mirrored rotationY,
         overshooting the tilt then pivoting into place near flat. */
      var TILT = 5;            // settled tilt, near flat as the packet asks
      var OVERSHOOT = 16;      // pivot-into-place feel
      var SLIDE = 420;         // from the wings
      var ENTRY = 0.8;

      tl.fromTo(cardLeft,
        { x: -SLIDE, rotationY: TILT + OVERSHOOT, opacity: 0 },
        { x: 0, rotationY: TILT, opacity: 1, duration: ENTRY, ease: "power3.out" },
        0);
      tl.fromTo(cardRight,
        { x: SLIDE, rotationY: -TILT - OVERSHOOT, opacity: 0 },
        { x: 0, rotationY: -TILT, opacity: 1, duration: ENTRY, ease: "power3.out" },
        0.1);

      /* the ornament wreath settles around the pair while they land */
      ornaments.forEach(function (el, i) {
        tl.fromTo(el,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.25 + i * 0.07);
      });

      /* Scene 2 (0.9 to 1.5s): headline lands word by word.
         The per word stagger is derived from the word count so the whole
         line fits its window, rather than hand keyed per word. */
      var WORD_DUR = 0.36;
      var WORD_WINDOW = 0.3;
      var WORD_STAGGER = Math.min(0.08, WORD_WINDOW / words.length);
      words.forEach(function (el, i) {
        tl.fromTo(el,
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: WORD_DUR, ease: "power3.out" },
          0.9 + i * WORD_STAGGER);
      });

      /* badge pills spring pop onto the bottom edge of each card (smooth settle).
         The pills are positioned at their centre point, so the centring offset
         is folded into the tween rather than a CSS transform. */
      var POP = 0.44;
      tl.fromTo(pillStars,
        { scale: 0, opacity: 0, xPercent: -50, yPercent: -50 },
        { scale: 1, opacity: 1, xPercent: -50, yPercent: -50, duration: POP, ease: "power3.out" },
        1.0);
      tl.fromTo(pillPassport,
        { scale: 0, opacity: 0, xPercent: -50, yPercent: -50 },
        { scale: 1, opacity: 1, xPercent: -50, yPercent: -50, duration: POP, ease: "power3.out" },
        1.06);

      /* Scene 3 (1.5 to 2.0s): held read. The only motion is the sanctioned
         subtle jitter on the two cards, lowest amplitude, counter phase,
         one finite half sine out and back (no repeat, no yoyo), ending at rest. */
      var JIT = 1.5;           // px, 2px default divided by root 2 for two elements
      tl.to(cardLeft, { y: -JIT, duration: 0.25, ease: "sine.inOut" }, 1.5);
      tl.to(cardLeft, { y: 0, duration: 0.25, ease: "sine.inOut" }, 1.75);
      tl.to(cardRight, { y: JIT, duration: 0.25, ease: "sine.inOut" }, 1.5);
      tl.to(cardRight, { y: 0, duration: 0.25, ease: "sine.inOut" }, 1.75);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
      tl.seek(0);
    })();
  </script>
