    (function () {
      var ID = "04-stage-check";
      var DURATION = 2.2;
      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0 to 0.7s): the mark blooms, the question lands ---------- */

      // spring-pop-entrance, playful variant: the one bloom from zero with overshoot and a hint of rotation.
      tl.fromTo(
        "#sc04-mark",
        { scale: 0, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(1.8)" },
        0.02
      );

      // Corner ornaments settle in quietly behind the bloom (smooth, no overshoot).
      var orns = ["#sc04-orn-a", "#sc04-orn-b", "#sc04-orn-c"];
      var ornRot = [-12, 9, -7];
      orns.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0, rotation: ornRot[i] - 20 },
          { scale: 1, opacity: 1, rotation: ornRot[i], duration: 0.42, ease: "power3.out" },
          0.12 + i * 0.06
        );
      });

      // dynamic-content-sequencing: per word start times precomputed once from a base + stagger,
      // never inside an onUpdate. Five words land inside one beat.
      var Q_START = 0.34, Q_STAGGER = 0.06, Q_DUR = 0.34;
      var qWords = gsap.utils.toArray("#sc04-q .sc04-w");
      var qTimes = qWords.map(function (_, i) { return Q_START + i * Q_STAGGER; });
      qWords.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: Q_DUR, ease: "power3.out" },
          qTimes[i]
        );
      });

      /* ---------- Scene 2 (0.7 to 1.5s): the button rises, presses, springs back; sub line reveals ---------- */

      // spring-pop-entrance, smooth: the button rises into its slot beneath the question.
      var BTN_IN = 0.72, BTN_IN_DUR = 0.42;
      tl.fromTo(
        "#sc04-btn",
        { scale: 0.7, y: 36, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: BTN_IN_DUR, ease: "power3.out" },
        BTN_IN
      );

      // press-release-spring: linear press (button sinks 4px toward its shadow, shadow shrinks 5px to 1px),
      // then a back.out(2) release starting exactly where the press ends (state continuity by adjacency).
      // Both tweens are plain .to so their start values are read when the playhead first reaches them
      // (after the entrance has landed at scale 1), never captured at build time mid-entrance.
      var REST_SHADOW = "rgb(201, 154, 40) 0px 5px 0px 0px";
      var PRESSED_SHADOW = "rgb(201, 154, 40) 0px 1px 0px 0px";
      var PRESS_START = BTN_IN + BTN_IN_DUR + 0.02; // 1.16
      var PRESS_DUR = 0.12;
      var RELEASE_START = PRESS_START + PRESS_DUR;   // 1.28
      var RELEASE_DUR = 0.5;
      tl.to(
        "#sc04-btn",
        { scale: 0.93, y: 4, boxShadow: PRESSED_SHADOW, duration: PRESS_DUR, ease: "power1.in", lazy: false },
        PRESS_START
      );
      tl.to(
        "#sc04-btn",
        { scale: 1, y: 0, boxShadow: REST_SHADOW, duration: RELEASE_DUR, ease: "back.out(2)", lazy: false },
        RELEASE_START
      );

      // dynamic-content-sequencing again: the sub line reveals per word as the button recovers.
      var S_START = RELEASE_START + 0.02, S_STAGGER = 0.05, S_DUR = 0.3;
      var sWords = gsap.utils.toArray("#sc04-sub .sc04-w");
      var sTimes = sWords.map(function (_, i) { return S_START + i * S_STAGGER; });

          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: S_DUR, ease: "power2.out" },
          sTimes[i]

      });

      // stat-bars-and-fills used as a mask wipe: a clip-path inset fill from the left edge, never a width tween.
      var URL_START = 1.52, URL_DUR = 0.5;
      tl.fromTo(
        "#sc04-url-mask",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: URL_DUR, ease: "power2.out" },
        URL_START
      );

      // Final frame of the film: pin the timeline to exactly 2.2s and hold the resolved state. No exit.
      var hold = { t: 0 };
      tl.to(hold, { t: 1, duration: DURATION - (URL_START + URL_DUR), ease: "none" }, URL_START + URL_DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
