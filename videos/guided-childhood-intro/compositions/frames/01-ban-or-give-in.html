  <script>
    (function () {
      var ID = "01-ban-or-give-in";
      var DURATION = 2.8;
      var FLIP_AT = 1.6; // Scene 3: the field hard flips to ink
      var SNAP = 0.002; // a two millisecond ramp reads as a hard cut and lands on the flip frame

      var byId = function (suffix) {
        return document.getElementById(ID + "-" + suffix);
      };

      var l1 = byId("l1");
      var l1Left = byId("l1-left");
      var l1Right = byId("l1-right");
      var l2 = byId("l2");
      var l2Cut = byId("l2-cut");
      var l3 = byId("l3");
      var ink = byId("ink");
      var starPaths = [byId("star-tl").querySelector("path"), byId("star-br").querySelector("path")];
      var words = Array.prototype.slice.call(l3.querySelectorAll(".ban01-w"));

      var tl = gsap.timeline({ paused: true });

      // Full-length driver so the timeline's duration is exactly the frame's 2.8s.
      tl.to({ t: 0 }, { t: 1, duration: DURATION, ease: "none" }, 0);

      // Scene 1 (0.0 to 0.8): "Ban it all?" spring pops into dead centre, smooth long tail, no overshoot.
      tl.fromTo(
        l1,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0
      );

      // Scene 2 (0.8 to 1.6): relay swap. The prior line shrinks and split slides off both edges
      // with a clip fade; the next line scale pops into the same centre while the halves are
      // still at speed, so the two halves read as one move.
      var EXIT_AT = 0.8;
      var EXIT_DUR = 0.38;
      var OVERLAP = 0.16;
      tl.fromTo(
        l1Left,
        { x: 0, scale: 1, opacity: 1 },
        { x: -1100, scale: 0.55, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        EXIT_AT
      );
      tl.fromTo(
        l1Right,
        { x: 0, scale: 1, opacity: 1 },
        { x: 1100, scale: 0.55, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        EXIT_AT
      );
      tl.fromTo(
        l2,
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        EXIT_AT + EXIT_DUR - OVERLAP
      );

      // Scene 3 (1.6 to 2.8): whole-state swap at one threshold. Field to ink, the prior beat
      // cut away, the corner stars to a butter fill. Each is an instant state change.
      tl.fromTo(ink, { opacity: 0 }, { opacity: 1, duration: SNAP, ease: "none" }, FLIP_AT - SNAP);
      tl.fromTo(l2Cut, { opacity: 1 }, { opacity: 0, duration: SNAP, ease: "none" }, FLIP_AT - SNAP);
      tl.fromTo(
        starPaths,
        { fill: "#FFFBEE" },
        { fill: "#EDC35F", duration: SNAP, ease: "none" },
        FLIP_AT - SNAP
      );

      // Per word reveal. Start times are derived from the content: a base step per word plus
      // a small per character term, so longer words earn a hair more room. The whole group
      // lands inside half a second, then holds still to the end of the frame.
      var WORDS_AT = FLIP_AT + 0.04;
      var STEP_BASE = 0.05;
      var SEC_PER_CHAR = 0.006;
      var WORD_POP = 0.4;
      var at = WORDS_AT;
      words.forEach(function (w) {
        tl.fromTo(
          w,
          { opacity: 0, scale: 0.6, y: 24 },
          { opacity: 1, scale: 1, y: 0, duration: WORD_POP, ease: "power3.out" },
          at
        );
        at += STEP_BASE + w.textContent.length * SEC_PER_CHAR;
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
