    /* Frame root: styled via #root only (never a class on the composition element).

    #root {

      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: nunito, sans-serif;
      color: #1A1A2E;

    /* Depth layers: field (0) · pathway line (1) · cutouts and pills (2) · copy and ornament (3).

    /* Pathway: an ink stroke that self draws (svg-path-draw). fill none so only the pen shows. */
    [id="02-the-third-way-pathway"] svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

    [id="02-the-third-way-line"] {

    <!-- Layer 0: cream field -->
    <div data-hf-id="hf-h4g1" id="02-the-third-way-field" class="clip" data-start="0" data-duration="3.5" data-track-index="0"></div>

    <!-- Layer 1: the pathway line -->
    <div data-hf-id="hf-i3fa" id="02-the-third-way-pathway" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
      <svg data-hf-id="hf-m4cd" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <!-- Layer 2: the five Planet Friends and their age pills -->
    <div data-hf-id="hf-1gik" id="02-the-third-way-cast" class="clip" data-start="0" data-duration="3.5" data-track-index="2">
      <img data-hf-id="hf-gb5e" class="02-the-third-way-friend" src="assets/pebble-this-stages-planet-friend.png" alt="Pebble, ages 4 to 7">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-the-third-way";
      var byId = function (s) { return document.getElementById(ID + "-" + s); };
      var byClass = function (s) {
        return Array.prototype.slice.call(document.querySelectorAll('[class~="' + ID + "-" + s + '"]'));
      };

      /* ---------- Pathway geometry ----------
         A gentle rising curve sampled into a polyline, so every station's y comes from the
         same function that draws the line: the friends stand exactly on the path. */
      var X0 = 200, X1 = 1720, Y0 = 640, RISE = 110, SAMPLES = 64;
      var yAt = function (x) {
        var u = (x - X0) / (X1 - X0);
        return Y0 - RISE * Math.pow(u, 1.5);
      };
      var pts = [];
      for (var i = 0; i <= SAMPLES; i++) {
        var px = X0 + ((X1 - X0) * i) / SAMPLES;
        pts.push([px, yAt(px)]);
      }
      var line = byId("line");
      line.setAttribute(
        "d",
        pts.map(function (p, k) { return (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ")
      );

      /* Cumulative polyline length: the fraction of the draw at which the pen reaches x. */
      var cum = [0];
      for (var j = 1; j < pts.length; j++) {
        cum.push(cum[j - 1] + Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]));
      }
      var total = cum[cum.length - 1];
      var fracAt = function (x) {
        var u = ((x - X0) / (X1 - X0)) * SAMPLES;
        var k = Math.min(SAMPLES - 1, Math.max(0, Math.floor(u)));
        var f = u - k;
        return (cum[k] + (cum[k + 1] - cum[k]) * f) / total;
      };

      /* ---------- Stations ----------
         Five slots at 336px pitch, 288 to 1632: the row spans 70% of the width. */
      var STATIONS = [288, 624, 960, 1296, 1632];
      var FRIEND = 1080 * 0.14; /* 14% of frame height, matches the 14cqh box */
      var friends = byClass("friend");
      var pills = byClass("pill");
      STATIONS.forEach(function (x, k) {
        var y = yAt(x);
        friends[k].style.left = (x - FRIEND / 2).toFixed(1) + "px";
        /* The cutouts' feet sit at about 86% of the image height; land them on the stroke. */
        friends[k].style.top = (y - FRIEND * 0.86).toFixed(1) + "px";
        pills[k].style.left = x.toFixed(1) + "px";
        pills[k].style.top = (y + 22).toFixed(1) + "px";
      });

      /* ---------- svg-path-draw setup: measured lengths, never guessed ---------- */
      var lineLen = line.getTotalLength();
      line.style.strokeDasharray = String(lineLen);
      line.style.strokeDashoffset = String(lineLen);
      var star = byId("star");
      var starLen = star.getTotalLength();
      star.style.strokeDasharray = String(starLen);
      star.style.strokeDashoffset = String(starLen);

      /* ---------- Timeline ---------- */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* dynamic-content-sequencing: per word stagger computed from the word count so a
         line fills its window exactly, no per word offsets hand keyed. */
      var wordReveal = function (els, start, end, dur, rise) {
        var n = els.length;
        var stagger = n > 1 ? (end - start - dur) / (n - 1) : 0;
        els.forEach(function (el, k) {
          tl.fromTo(
            el,
            { y: rise, opacity: 0 },
            { y: 0, opacity: 1, duration: dur, ease: "power3.out" },
            start + k * stagger
          );
        });
      };

      /* Scene 1 (0.0 to 0.8s): headline lands word by word; the corner star draws itself in. */
      wordReveal(byClass("hw"), 0.04, 0.8, 0.5, 28);
      tl.to(star, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.15);

      /* Scene 2 (0.8 to 2.1s): the pathway self draws at pen speed; as the pen reaches each
         station its Planet Friend slides a short distance up into the slot (item stagger
         assemble, low drama), then the badge pill pops beneath it (spring-pop-entrance, power3 settle). */
      var DRAW_AT = 0.8, DRAW_DUR = 0.9;
      tl.to(line, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "none" }, DRAW_AT);
      STATIONS.forEach(function (x, k) {
        var at = DRAW_AT + DRAW_DUR * fracAt(x);
        tl.fromTo(
          friends[k],
          { y: 44, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          at
        );
        tl.fromTo(
          pills[k],
          { xPercent: -50, scale: 0, opacity: 0, y: 12 },
          { xPercent: -50, scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          at + 0.14
        );
      });

      /* Scene 3 (2.1 to 3.0s): the sub line reveals word by word, then everything holds still. */
      wordReveal(byClass("sw"), 2.1, 2.97, 0.42, 18);

      /* Pin the timeline's end to the frame's 3.0s duration (a zero length proxy tween, no motion). */
      tl.to({ v: 0 }, { v: 1, duration: 0, ease: "none" }, 3.0);

      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
