<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Planet Friends music video, style frame: the Pebble verse, 42.8 to 52.8 s
         of the jazz take. Night comic look over the APPROVED cutout only
         (brand/GDC_SOCIAL_VISUAL_SYSTEM.md section 1). House tokens, house fonts. */
      @font-face { font-family: "Nunito"; src: url("assets/fonts/nunito-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      :root {
        --ink: #1a1a2e; --espresso: #2e2818; --cream: #f9f8f6; --gold: #edc35f;
        --pebble: #c99a28; --pebble-soft: #fbeed0; --pebble-ink: #7a5a0e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--ink); font-family: "Nunito", sans-serif; }

      #stage { position: absolute; inset: 0; }

      /* The halftone spotlight: a gold falloff seen through a dot screen. */
      #spot { z-index: 0;
        position: absolute; left: 90px; top: 110px; width: 980px; height: 980px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, var(--gold) 0%, var(--pebble) 38%, rgba(201,154,40,0.35) 58%, rgba(201,154,40,0) 72%);
        -webkit-mask-image: radial-gradient(circle, #000 46%, transparent 52%);
        -webkit-mask-size: 22px 22px;
        mask-image: radial-gradient(circle, #000 46%, transparent 52%);
        mask-size: 22px 22px;
      }
      #spot-core {
        position: absolute; left: 330px; top: 350px; width: 500px; height: 500px; border-radius: 50%;
        background: radial-gradient(circle, rgba(237,195,95,0.55) 0%, rgba(237,195,95,0) 70%);
      }

      /* Comic panels */
      .panel { position: absolute; border: 14px solid var(--cream); box-shadow: 18px 18px 0 var(--espresso); }
      #panel-left { left: 70px; top: 70px; width: 1000px; height: 940px; background: transparent; }
      #panel-right {
        left: 1100px; top: 120px; width: 750px; height: 640px; background: var(--cream);
        border-color: var(--ink); outline: 14px solid var(--cream);
      }
      #panel-small {
        left: 1140px; top: 800px; width: 680px; height: 190px; background: var(--pebble);
        border-color: var(--cream); display: flex; align-items: center; justify-content: center;
      }

      /* Comic print halftone creeping in from the paper's corner */
      #panel-right::after {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(circle, rgba(26,26,46,0.22) 32%, transparent 36%) 0 0 / 15px 15px;
        -webkit-mask-image: linear-gradient(135deg, transparent 52%, #000 100%);
        mask-image: linear-gradient(135deg, transparent 52%, #000 100%);
      }
      /* Gaffer tape across the corner, like a flight case at a gig */
      #tape {
        position: absolute; z-index: 5; left: 40px; top: 960px; padding: 12px 30px 10px; transform-origin: 0 0;
        background: var(--gold); color: var(--ink); box-shadow: 0 6px 0 rgba(0,0,0,0.35);
        font-family: "Plex Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.4em; white-space: nowrap;
      }
      .splat { position: absolute; border-radius: 50%; }

      /* Name plate, stencilled like a flight case */
      #plate {
        position: absolute; left: 120px; top: 120px; padding: 14px 26px 12px;
        border: 5px solid var(--cream); background: var(--ink); color: var(--cream);
        font-family: "Plex Mono", monospace; font-weight: 700; font-size: 44px; letter-spacing: 0.32em;
      }
      #plate small { display: block; margin-top: 6px; font-size: 18px; font-weight: 600; letter-spacing: 0.22em; color: var(--gold); }

      /* Pebble: ink outline from stacked hard shadows, halftone shadow behind */
      #pebble-wrap { position: absolute; left: 240px; top: 230px; width: 680px; height: 680px; }
      #pebble-shadow {
        position: absolute; inset: 0; transform-origin: 50% 55%;
        background: radial-gradient(circle, var(--espresso) 45%, transparent 50%) 0 0 / 12px 12px;
        -webkit-mask-image: url("assets/pebble.png"); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
        mask-image: url("assets/pebble.png"); mask-size: contain; mask-repeat: no-repeat; mask-position: center;
      }
      #pebble {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 55%;
        filter: drop-shadow(6px 0 0 var(--ink)) drop-shadow(-6px 0 0 var(--ink)) drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 -6px 0 var(--ink));
      }

      /* Lyrics: a comic caption box, words stamped on */
      #lyrics { position: absolute; left: 1160px; top: 175px; width: 630px; height: 530px; }
      .line {
        position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; gap: 4px 22px;
        font-weight: 900; font-size: 104px; line-height: 1.0; letter-spacing: -0.02em; color: var(--ink);
        text-shadow: 6px 5px 0 rgba(201,154,40,0.55);
      }
      .w { display: inline-block; opacity: 0; }
      .hl { background: var(--gold); padding: 0 12px; box-shadow: 6px 6px 0 var(--ink); }

      #lesson {
        font-family: "Plex Mono", monospace; font-weight: 700; color: var(--ink); text-align: center;
        font-size: 26px; letter-spacing: 0.12em; line-height: 1.35; padding: 0 30px;
      }
      #lesson b { display: block; font-size: 18px; letter-spacing: 0.3em; color: var(--ink); opacity: 0.85; margin-bottom: 6px; }

      /* Paper grain that boils on the beat */
      #grain {
        position: absolute; inset: -40px; pointer-events: none; opacity: 0.42; mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 45% 50%, rgba(0,0,0,0) 55%, rgba(10,10,20,0.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="stage">
        <div id="spot"></div>
        <div id="spot-core"></div>
        <div id="panel-left" class="panel"></div>
        <div id="pebble-wrap">
          <div id="pebble-shadow"></div>
          <img id="pebble" src="assets/pebble.png" alt="" />
        </div>
        <div id="plate">PEBBLE<small>STAGE 1 · AGES 4 TO 7</small></div>
        <div id="panel-right" class="panel"></div>
        <div id="lyrics"></div>
        <div class="splat" style="left:1040px;top:60px;width:46px;height:46px;background:#edc35f;opacity:0.9"></div><div class="splat" style="left:1092px;top:40px;width:14px;height:14px;background:#edc35f;opacity:0.9"></div><div class="splat" style="left:1010px;top:30px;width:10px;height:10px;background:#f9f8f6;opacity:0.8"></div><div class="splat" style="left:1075px;top:104px;width:8px;height:8px;background:#edc35f;opacity:0.8"></div><div class="splat" style="left:60px;top:990px;width:38px;height:38px;background:#f9f8f6;opacity:0.85"></div><div class="splat" style="left:112px;top:1030px;width:12px;height:12px;background:#f9f8f6;opacity:0.8"></div><div class="splat" style="left:30px;top:960px;width:9px;height:9px;background:#edc35f;opacity:0.8"></div><div class="splat" style="left:1860px;top:770px;width:30px;height:30px;background:#edc35f;opacity:0.85"></div><div class="splat" style="left:1890px;top:740px;width:10px;height:10px;background:#f9f8f6;opacity:0.8"></div>
        <div id="tape">PLANET FRIENDS &nbsp; MISSION CONTROL</div>
        <div id="panel-small" class="panel"><div id="lesson"><b>THE LESSON</b>Real, pretend, or made by a computer</div></div>
      </div>
      <div id="grain"></div>
      <div id="vignette"></div>
      <audio id="bgm" src="assets/bgm.mp3" data-start="0" data-duration="10" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      // Word times are frame local (track time minus 42.8 s), from a word level
      // transcription of the jazz take; the words themselves come from lyrics.txt.
      const LINES = [
        { from: 0.40, to: 3.40, words: [["Pebble", 0.45], ["on", 0.72], ["the", 0.84], ["mic,", 0.98], ["whoops!", 1.56, 1]] },
        { from: 3.40, to: 6.00, words: [["Flip", 3.45], ["it", 3.66], ["right", 4.02, 1], ["way", 4.05, 1], ["round,", 4.31, 1], ["kindest", 4.85], ["planet", 5.21]] },
        { from: 6.00, to: 8.55, words: [["Real?", 6.25, 1], ["Pretend?", 6.75, 1], ["Made", 7.49], ["by", 7.67], ["a", 7.74], ["computer?", 8.06, 1]] },
        { from: 8.55, to: 10.0, words: [["Not", 8.56], ["sure?", 8.64], ["Ask", 9.0], ["a", 9.16], ["grown", 9.32, 1], ["up.", 9.61, 1]] },
      ];
      const BEATS = [0.134, 0.761, 1.388, 2.015, 2.665, 3.292, 3.942, 4.569, 5.219, 5.846, 6.496, 7.123, 7.75, 8.4, 9.05, 9.677];

      const box = document.getElementById("lyrics");
      LINES.forEach((l, i) => {
        const el = document.createElement("div");
        el.className = "line"; el.id = "line-" + i;
        l.words.forEach(([t, , hl], j) => {
          const s = document.createElement("span");
          s.className = "w" + (hl ? " hl" : ""); s.id = `w-${i}-${j}`; s.textContent = t;
          el.appendChild(s);
        });
        box.appendChild(el);
      });

      // Seeded jitter for the misregistration, so every render matches.
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) - 0.5;

      const tl = gsap.timeline({ paused: true });

      // Panels slam in, the spotlight warms up
      tl.fromTo("#panel-left", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo("#panel-right", { opacity: 0, x: 60, rotation: 3 }, { opacity: 1, x: 0, rotation: 1.2, duration: 0.3, ease: "back.out(2)" }, 0.08);
      tl.fromTo("#panel-small", { opacity: 0, y: 40, rotation: -4 }, { opacity: 1, y: 0, rotation: -1.5, duration: 0.3, ease: "back.out(2)" }, 5.9);
      tl.fromTo("#lesson", { scale: 0.6 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 5.95);
      tl.fromTo("#spot", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#tape", { opacity: 0, rotation: -10, x: -120 }, { opacity: 1, rotation: -6, x: 0, duration: 0.3, ease: "power3.out" }, 0.3);
      tl.fromTo(".splat", { scale: 0 }, { scale: 1, duration: 0.18, ease: "back.out(3)", stagger: 0.03 }, 0.15);
      tl.fromTo("#plate", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.2);

      // Pebble arrives upside down (the running joke), wobbles on "whoops",
      // then flips the right way round on "flip it right way round".
      tl.fromTo("#pebble-wrap", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.1);
      tl.set(["#pebble", "#pebble-shadow"], { rotation: 180 }, 0);
      tl.set("#pebble-shadow", { x: 26, y: 26 }, 0);
      tl.to(["#pebble", "#pebble-shadow"], { rotation: 168, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.56);
      tl.to(["#pebble", "#pebble-shadow"], { rotation: 360, duration: 0.55, ease: "back.out(1.8)" }, 3.45);

      // Pebble's habit: rocks on the spot, in time with nothing (half a beat off).
      for (let k = 0; k < 9; k++) {
        const t = 4.1 + k * 0.63 + 0.31;
        if (t > 9.8) break;
        tl.to("#pebble-wrap", { rotation: k % 2 ? 4 : -4, duration: 0.3, ease: "sine.inOut", overwrite: "auto" }, t);
      }

      // Lines: stamp each word on, clear the line at its end
      LINES.forEach((l, i) => {
        l.words.forEach(([, t], j) => {
          tl.fromTo(`#w-${i}-${j}`, { opacity: 0, scale: 1.5, rotation: (j % 2 ? 4 : -4) },
            { opacity: 1, scale: 1, rotation: 0, duration: 0.14, ease: "power4.out" }, t);
        });
        if (l.to < 10) tl.to(`#line-${i}`, { opacity: 0, y: -18, duration: 0.12, ease: "power2.in" }, l.to - 0.12);
      });

      // On every beat: the spotlight thumps, the grain boils, the print slips
      BEATS.forEach((b, k) => {
        tl.fromTo("#spot", { scale: 1.05 }, { scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, b);
        tl.set("#grain", { x: Math.round(rnd() * 60), y: Math.round(rnd() * 60) }, b);
        tl.set("#stage", { x: Math.round(rnd() * 8), y: Math.round(rnd() * 6) }, b);
        tl.set("#stage", { x: 0, y: 0 }, b + 0.07);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
