# The wiring check, on every push and pull request.
#
# Health checks answer "is it up". This answers "is it connected", which is a
# different question and the one that kept getting the wrong answer: a link to
# a route that does not exist, a component imported nowhere, a step of the five
# a day that sends a child away and is never ticked. Every one of those passed
# every health check, because the system was up and doing the wrong thing.
#
# No database, no secrets, no build. It reads the source and exits non zero, so
# a broken wire cannot reach main without someone deciding to let it.
name: Wiring

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wiring-check.mjs

  # The check in guard, against the live component on the dev fixture.
  #
  # scripts/check-concern-dots.mjs is the only automated check of the daily
  # check in card, and until 1 September 2026 it was wired into nothing: it
  # had already gone stale against the shipped design twice, and a guard that
  # only runs when someone remembers it is a comment, not a guard. The
  # fixture at /dev/concern-scale renders the real ConcernCheckIn with static
  # props and the guard mocks the save route, so this needs no database and
  # no secrets, the same bar as the wiring check above.
  checkin-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the app and run the guards
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/dev/concern-scale && break
            sleep 2
          done
          npm run checkin-guard
          # The classroom wall's contrast, which rides here because it is the
          # same shape of check and the app is already up. It has to RENDER:
          # a source reading version of it was written first and was wrong
          # three ways, because a gradient backdrop, an opacity group and a
          # token alias are all invisible to anything that only reads the
          # source. See the header of check-wall-contrast.mjs.
          npm run wall-contrast-guard
          # And once more with the teacher's chrome: the arc rail and the
          # presenter bar carry labels only a teacher reads, and a label only
          # a teacher reads still has to clear AA.
          GC_WALL_QUERY='&teacher=1' npm run wall-contrast-guard

  # The two guards on the join between what a parent answers and what the
  # daily check in asks about.
  #
  # Both existed as scripts anybody could run and nothing did run, which is a
  # comment rather than a guard, and this join has broken silently three times
  # (see the header of check-baseline-seed). No database, no build, no
  # secrets: they read the source and reproduce the mapping.
  concern-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No database, no build, no browser: it reads the source. The token guard
      # rides here because it is the same shape of check, a thing that cannot
      # fail typechecking and cannot be seen without opening a browser.
      - run: node scripts/check-tokens.mjs
      # The schools app may not grow a new off scale type or space value.
      # A ratchet, not a zero: the number may only ever fall.
      - run: node scripts/check-schools-scale.mjs
      # The daily screen guide and the base under it. Both are just numbers, so
      # nothing else can catch a base that climbs above its own ceiling.
      - run: node scripts/check-screen-guide.mjs
      # Home and the Setup Quest are two implementations of one question. This
      # holds them to the same answer, which is what the loop was.
      - run: node scripts/check-setup-agreement.mjs
      # Four marketing pages quote the price as prose, so there is no constant
      # to import and drift is a matter of when. On 9 September the reveal was
      # the only page in the funnel with no price at all.
      - run: node scripts/check-price-copy.mjs
      # What day is it? The check in decided in UTC while every family is on UK
      # time, so for one hour every summer night the product and the house
      # disagreed. Also holds the Setup Quest's finished card to the real check
      # in state rather than assuming it is waiting.
      - run: node scripts/check-day-boundary.mjs
      # The Friend beside the road recommends ONE thing by name, which promises
      # the thing is there. "See their week honestly" on day two opens on a week
      # that has not happened.
      - run: node --experimental-strip-types scripts/check-bonus-ready.mjs
      # A page can build, render and take payments while being unreachable. The
      # shop did, for four weeks, after a Home cleanup removed its only tile.
      - run: node scripts/check-reachable.mjs
      # A lesson four years above the child was offered as work, done, and
      # then correctly not counted, with nothing anywhere saying why. None of
      # that fails a typecheck and none of it is visible without a child of
      # exactly the wrong age in a signed in session.
      - run: node scripts/check-lesson-age-gate.mjs
      # A rung must read the field that means the thing it claims. The Moment
      # rung ticked off daily_sessions.completed_at, which means the DAY
      # finished, and the script rung counted a row it never read the status of.
      - run: node scripts/check-rung-truth.mjs
      # A five year old and a fourteen year old must not be handed the same
      # day. pickDay took a child and a date and nothing else for months, and
      # nothing about that fails a typecheck.
      - run: node --experimental-strip-types scripts/check-day-by-age.mjs
      # Explanation grows back. The add a job screen carried a reason and a
      # repeat instruction on every one of fifteen closed rows, which is how a
      # one tap list became a 3554px page. Each of those lines was added by
      # somebody being helpful, so nothing but a check keeps them off.
      - run: node scripts/check-job-picker.mjs
      - run: node --experimental-strip-types scripts/check-job-guide.mjs
      # Every way into an account tells the truth about why it failed. The
      # starter pack showed a new customer the words "Failed to fetch", which is
      # Chrome's name for a request that died in the browser, and the fault it
      # was reporting has hit this product before.
      - run: node scripts/check-auth-honesty.mjs
      # The two checks that run on every tap (middleware, dashboard layout)
      # verify the session locally through getClaims and answer nobody for an
      # expired or unsigned token. Runs the real helper against fake auth
      # answers. See the header of check-session-check.mjs.
      - run: node --experimental-strip-types scripts/check-session-check.mjs
      # The deal ties together: a job says what it is worth at add time and
      # can be a family job, the list says when the first week is full by
      # age, the agreement is at the ask and at the yes, both sides are told
      # about the guide, and DiGi knows a first hello. See the header of
      # check-deal-ties-together.mjs.
      - run: node --experimental-strip-types scripts/check-deal-ties-together.mjs
      # The deal is the root: the passport reads it (and scores it instead of
      # the timer at four to seven), the road asks for it once there is a job
      # and for its review on the review date, the child agrees on their own
      # phone, and every clause carries a question to ask the child. See the
      # header of check-deal-in-the-loop.mjs.
      - run: node --experimental-strip-types scripts/check-deal-in-the-loop.mjs
      # Stickers that land: the timer, the jobs and time outside pay the
      # book, every owed sticker lands on the child's home with the why, the
      # parent is pushed with the why, Today sits on the child's bar, and the
      # sheet in the shop is the real catalogue. See the header of
      # check-stickers-land.mjs.
      - run: node --experimental-strip-types scripts/check-stickers-land.mjs

      # The client boundary. A server file that CALLS a named export of a
      # 'use client' module crashes on every request, and neither tsc nor
      # next build can see it: the import type checks, and a force-dynamic
      # route is never rendered at build time. It took a founder on a phone
      # to find the last one (14 September 2026, the child's Ask for screen
      # time page). This is the cheap way.
      - run: node --experimental-strip-types scripts/check-client-boundary.mjs

      # JSONB columns filtered with an array literal. postgrest-js sends a
      # Postgres array literal, Postgres rejects it as invalid json, and
      # supabase-js RETURNS that error rather than throwing, so the count
      # reads as an honest zero. It cost three stickers no child could earn
      # (14 September 2026). tsc cannot see it; only the database can.
      - run: node --experimental-strip-types scripts/check-jsonb-contains.mjs

      # Notification.requestPermission must be the first await after the tap.
      # The child's Yes please awaited the service worker twice before asking,
      # which spends the user activation, so iOS never opened the permission
      # sheet: a child tapped it, nothing happened, and a bare catch took the
      # card off the screen as well (15 September 2026). There were three hand
      # written copies of the sequence, two of them wrong in different ways.
      # One owner now, lib/push/enable.ts, and this fails the build on a
      # second caller or on an await creeping back in front of the ask.
      - run: node --experimental-strip-types scripts/check-push-gesture.mjs

      # One way to create an account. There were two, only one advertised, and
      # the unadvertised one never asked the time question, so DiGi was told
      # "not specified" and sized its advice to nobody. The two also wrote
      # different vocabularies into onboarding_answers.challenge (15 September
      # 2026). /signup redirects now; this fails the build if a second form or
      # a link to it comes back, or if either door stops writing a ChallengeId.
      - run: node --experimental-strip-types scripts/check-one-door.mjs

      # The red badge on the parent's Quests tab recounts when a parent answers
      # something. It showed 1 while the board under it said 0 and the database
      # agreed with the board (15 September 2026): the count lives in the LAYOUT
      # and answering happens in the PAGE, so the number stayed at whatever it
      # was last rendered as. gc:notifs-changed existed and the bar was simply
      # not listening, and the pitch path was not firing it at all.
      - run: node --experimental-strip-types scripts/check-badge-truth.mjs

      # The child's tab bar is fixed to the floor so a child can always
      # navigate. It was sticky to the TOP and rendered 2,250 lines down the
      # home screen, so on opening the app it was not on screen at all
      # (Justin, 15 September 2026). Fixed means portalled out of the zoomed
      # page, or it drifts up an iPhone as you scroll.
      - run: node --experimental-strip-types scripts/check-kid-tabbar.mjs
      # The tabs on the screens that are not the home screen: never on a
      # lesson player or the stage check, always with room made for the fixed
      # bar, and never printed onto a child's sheet.
      - run: node scripts/check-kid-chrome.mjs
      # A lesson co watched on the parent's device counts for the child it was
      # done with: the player names them, and their day is ticked through the
      # same function the child's own lesson uses.
      - run: node scripts/check-co-watch.mjs
      - run: node scripts/check-home-icon.mjs
      - run: node scripts/check-today-tick.mjs
      # The check in opens every day, and the rotation still owns the tick.
      # Justin, 18 September 2026: the check in was not the first thing on the
      # road. One completed day makes today a lesson day, the lesson led and
      # walked to the front, and the habit ended up below it. Position and the
      # day's one tick are now two separate things, and this holds them apart
      # in both directions: making the check in lead every day would satisfy
      # the first rule and quietly delete lesson, DiGi and passport days.
      - run: node scripts/check-checkin-leads-the-road.mjs
      # The monthly review reports what MOVED, not just minutes. Measured on
      # 18 September: 23 worries have reached done across every family and 134
      # are still being chased, which is the number this email exists to make
      # visible. The rule that looks like a detail is the one that matters: a
      # child with no timer run used to be dropped, so a family who never
      # started one got no email at all, and they are exactly the family whose
      # worries are the only reason they are here.
      - run: node scripts/check-monthly-review.mjs
      - run: node scripts/check-screens-rest.mjs
      - run: node scripts/check-job-row.mjs
      - run: node scripts/check-job-icons.mjs
      - run: node scripts/check-approve-warning.mjs
      - run: node scripts/check-tab-bar-clear.mjs
      - run: node scripts/check-watch-stage-copy.mjs
      - run: node scripts/check-kid-ask-visible.mjs
      - run: node scripts/check-trial-countdown-words.mjs

      # A lesson and the daily quiz are one objective, and the day counts
      # either. Teo passed a lesson on a day whose learning step was the quiz:
      # the passport counted it, markStep refused silently, and the day never
      # moved (15 September 2026, read from the live rows). This guard RUNS the
      # real rule rather than describing it, and fails if anything outside that
      # one pair is allowed to stand in for another step.
      - run: node --experimental-strip-types --import ./scripts/lib/ts-resolve.mjs scripts/check-learning-step.mjs
      # A child now opens the same book their parent keeps. The slots may show
      # the shape of the work and never the contents of an adult's notes, and
      # nothing on a child's screen may link to a shop. Neither fails a
      # typecheck, and adding the count to a slot looks like an improvement
      # right up until you remember who else is holding the phone.
      - run: node scripts/check-passport-readonly.mjs
      # The four things count everything the family is taught, the AI
      # modules included, and start at one declared age each. See the header
      # of check-readiness-areas.mjs.
      - run: node --experimental-strip-types scripts/check-readiness-areas.mjs
      # Every passport page prints what a pass IS (lessons, scripts, the
      # child's check) with the links, the peek on Today flips in for one
      # reason or not at all, and the page turn is GSAP with a way out for
      # reduced motion. See the header of check-passport-pass.mjs.
      - run: node --experimental-strip-types scripts/check-passport-pass.mjs
      # The top device problems by age, each with a source and a proof path
      # that exists in the seeds, read by DiGi, the loop and the recommender.
      - run: node --experimental-strip-types scripts/check-device-issues.mjs
      # The parent's habit: the evening reminder per parent at their time
      # only when the day is open, no loss language, the milestones named,
      # the habit measured. See the header of check-habit-loop.mjs.
      - run: node --experimental-strip-types scripts/check-habit-loop.mjs
      # The daily sticker pays once, on the day's own row, in the same write
      # that lands the day. Split it into a second write and a failed one
      # leaves a finished day with no sticker and nothing to reconcile it.
      # Both Homes read one function, because two screens counting the same
      # table is how they came to disagree twice in one morning.
      - run: node scripts/check-daily-sticker.mjs
      # A worry raised in a DiGi chat reaches the next check in, says where it
      # came from, and arrives with somewhere to go. The next moves used to be
      # a dip's alone, and a first ever row has no last time to dip from, so
      # the one worry the parent actually asked about was the only one that
      # could not offer help.
      - run: node scripts/check-new-worry.mjs
      # The quiet grey stays readable. --ink-muted carries most of the second
      # sentence on the product and was 3.46 to 1 on white, under the 4.5 AA
      # floor, on every surface in the house. Nobody reports grey text. They
      # stop reading it.
      - run: node scripts/check-muted-contrast.mjs
      # What a parent types into Something else becomes a label we print for
      # years and, until today, a database key with their typo in it. Most
      # typed worries are one of our own in their words, so they are matched
      # back to it; the rest keep their words, tidied and never corrected.
      - run: node --experimental-strip-types scripts/check-worry-normalise.mjs
      # DiGi drives setup while there is any of it left, then hands over to the
      # day. Home knew the steps and DiGi knew how to point at one thing, and
      # the two had never been introduced, so a new family met a warm greeting
      # aimed at the daily loop while four steps sat on a page they had to find.
      - run: node scripts/check-digi-drives-setup.mjs
      # The three questions come first and the account comes last. Every advert
      # we run says "Three questions. No sign up." and for two months the second
      # screen of the funnel asked for a name, an email and a password. Nothing
      # failed, and the whole route to 4,000 a month runs through that page.
      - run: node scripts/check-starter-order.mjs
      - run: node scripts/check-starter-fold.mjs
      - run: node scripts/check-one-tap.mjs
      - run: node scripts/check-pathway-notes.mjs
      - run: node scripts/check-children-age-up.mjs
      - run: node --experimental-strip-types scripts/check-focus-labels.mjs
      - run: node --experimental-strip-types scripts/check-baseline-seed.mjs
      - run: node --experimental-strip-types scripts/check-silver-rule.mjs
      # The free text gate on the reveal. It shipped broken and silent: a gate
      # that decides between selling and handing over a phone number cannot be
      # allowed to fail without anything going red.
      - run: node --experimental-strip-types scripts/check-risk-gate.mjs
      # The lesson council's own scoring rules, against fixtures. The live run
      # needs a service role key and so cannot live here, but the rules are the
      # part that has actually been wrong: twice, both times in code that could
      # not run without production credentials, and both times found by reading
      # rather than by failing. This is the file that fails instead.
      - run: node scripts/council-checks.test.mjs
      # Nothing on a classroom wall renders below the ISO 9241 legibility floor.
      # Three separate times the projector shipped at phone size and every one
      # of them passed typecheck, tests and health checks, because a font size
      # that is too small is legal code. This reads the source.
      - run: node scripts/check-wall-scale.mjs
      # The AI governance framework: the question set, the ratings, and the
      # join from a procurement answer to a lesson. The last of those is why it
      # is here. The result page offers a school named lessons to teach before
      # pupils touch a product, and a link to a lesson that does not exist is
      # worse than no link at all. Nothing about that fails a typecheck.
      - run: node --experimental-strip-types scripts/ai-governance.test.mjs
      - run: node --experimental-strip-types scripts/answer-beat.test.mjs
      # One module of twenty three sits outside the licence wall on purpose so
      # a lesson link Justin sends actually opens. A deliberate hole is exactly
      # the kind that gets quietly widened, and every school that pays is
      # paying for the other twenty two staying shut.
      - run: node --experimental-strip-types scripts/check-taster-wall.mjs
      # The pilot request is a page of our own (13 September 2026): no door
      # back out to Mailchimp, /pilot open and in the sitemap, and the pilot
      # word the same at both ends of the letterbox. See check-pilot-door.mjs.
      - run: node --experimental-strip-types scripts/check-pilot-door.mjs
      # The character voices: one friend per card and lesson, no retired
      # cast in the manifest or the intro lines. See check-character-voices.mjs.
      - run: node scripts/check-character-voices.mjs
      # The buying documents: terms, privacy notice and DPA exist, are open
      # and linked, carry no dash, name the same providers, and read every
      # company fact from shared/legal.ts (13 September 2026).
      - run: node scripts/check-schools-legal.mjs
      # The print kit: the Planet Friend on every printable sheet, one
      # worksheet reader for both data shapes, and the passport print out's
      # fold order intact (14 September 2026).
      - run: node scripts/check-print-kit.mjs
      # The source copy of ks3-22, held to every rule the scheme has learned:
      # cycle anchoring, cycle minutes, the four minute passive ceiling, an
      # honest timing string, the contract keys, and a teacher script on every
      # slide. It caught three scriptless diagrams during the build that
      # nothing else would have. The other 21 modules live only in the
      # database, so this runs against the one module whose source is here.
      - run: node scripts/check-module-contract.mjs content/modules/ks3-22-when-an-ai-acts-like-a-friend.json
      - run: node scripts/check-module-contract.mjs content/modules/ks2-23-when-a-machine-talks-like-a-friend.json
      - run: node scripts/check-module-contract.mjs content/modules/ks3-24-is-it-doing-my-thinking.json
      - run: node scripts/check-module-contract.mjs content/modules/ks2-25-stay-the-maker.json
      # One passport, two products: every module in the curriculum lands in
      # one of the four agreed areas, and the school side's copy of the
      # parents app's area model has not drifted from the original.
      - run: node scripts/check-passport-areas.mjs
      # The school to home bridge, and the promises around it. Every rule in
      # here guards something that fails QUIETLY: a parent note that lost its
      # QR still prints, a price on the supplies page still renders, a second
      # copy of the zine fold still folds until the two copies disagree.
      # Header of check-passport-bridge.mjs.
      - run: node scripts/check-passport-bridge.mjs
      # The printed passport has to fit the paper. Measured 16 September
      # 2026: both print routes went to the printer 7 per cent too big,
      # because the dashboard shell's 1.07 zoom applies on paper and neither
      # print block reset it, and the burgundy cover came out white because
      # Chrome ships with background graphics off. Neither is visible to a
      # typecheck or a screenshot. Header of check-passport-print-geometry.
      - run: node scripts/check-passport-print-geometry.mjs
      # Day one acknowledges, it does not ask for a number. Measured on a real
      # account 17 September 2026: seven ratings in thirty five seconds, ninety
      # seconds after sign up, every one the same score, and that reading is
      # what the weekly email and the passport stamp are measured against. The
      # guard holds the day one branch, the cap of three per day, longest
      # unasked first, and the confirmation staying off first_checkin_at.
      - run: node scripts/check-first-checkin-acknowledge.mjs
      # "7 to resolve" has to land on the seven. Fixed on 8 August by pointing
      # the passport's moments row at the list of the parent's own concerns,
      # then quietly undone when another section took the same anchor id: two
      # elements with one id is a win for whichever is first in the document.
      # The guard holds the link and, more importantly, the id being unique.
      - run: node scripts/check-moments-anchor.mjs
      # Agreed counts like done, and never reads like it. Migration 306 gave a
      # device a third answer, so a family who decided a screen runs on an
      # agreement rather than on controls can finish a stage without lying in
      # either direction. Two rules pull opposite ways: every reader counts
      # status <> not_owned, and every surface says Agreed rather than All set.
      # Tidying the first into === done would look like a simplification and
      # would lock the stage again in silence.
      - run: node scripts/check-devices-agreed.mjs
      # The lesson tracker's contract. Every rule guards the thing that would
      # turn a green tick back into a form: a row moved into the automatic
      # block without a detector, a tick stored rather than computed, the
      # passport fact copied instead of read, or a pupil field appearing at
      # all. Strip types because it imports the model it checks.
      - run: node --experimental-strip-types scripts/check-lesson-tracker.mjs
      # Every safeguarding flagged module has a staff briefing, and every page
      # counts them from the manifest rather than by hand. Header of
      # check-flagged-briefings.mjs.
      - run: node scripts/check-flagged-briefings.mjs
      # Structure and density are checked above. This one checks whether the
      # claims are TRUE, against the four verification passes of 11 September.
      - run: node scripts/check-source-claims.mjs
      # A parent who asks DiGi a question must never be left with nothing, and
      # the latency row must say which of the two happened. Ten silent replies
      # in digi_latency read identically to ten warm apologies, so the guard
      # holds every give up path to a rescue, a word to the parent, and a
      # reason that records it. See the header of check-digi-rescue.mjs.
      - run: node scripts/check-digi-rescue.mjs
      # The model ladder holds and the parameters only some models accept
      # never reach the ones that reject them: no date suffixed ids, no forced
      # tool_choice, effort never sent to Haiku, fast mode never sent to a model
      # that cannot take it. Imports the real config, so it tests behaviour
      # rather than spelling. See the header of check-digi-model.mjs.
      - run: node --experimental-strip-types scripts/check-digi-model.mjs
      # DiGi steps in on judgement under a cap that is code: twice a week,
      # never two days running, the drumbeat gone. See the header of
      # check-digi-step-in.mjs.
      - run: node --experimental-strip-types scripts/check-digi-step-in.mjs
      # The researchers file leaves the prompt only by DIGI_RESEARCH_BASE, the
      # default stays the file, and DiGi's stance and every hard rule are in
      # the prompt whichever way it is set. Builds both prompts from the real
      # code. See the header of check-digi-research-base.mjs.
      - run: node --experimental-strip-types scripts/check-digi-research-base.mjs
      # Platform changes reach a family only through Justin's click. See the
      # header of check-platform-watch.mjs.
      - run: node --experimental-strip-types scripts/check-platform-watch.mjs
      # The assistant turn DiGi replays in a tool round is the turn the model
      # produced: thinking blocks and their signatures included, in order. A
      # thinking model rejects a turn with its reasoning removed. Runs the real
      # stream reader over a synthetic thinking turn.
      - run: node --experimental-strip-types scripts/check-digi-turn.mjs

      # What reaches a child's phone is decided in ONE place. kit, events and
      # homework are the child's own business; payments, deadlines and notices
      # never are unless a grown up sends that one item. The owning file says it
      # was pulled out of line because "written twice it would drift, and the
      # way it would drift is a payment reminder appearing on a nine year old's
      # phone", and on 17 September 2026 it was written four times: there, and
      # inline in each of the three reminder crons. They still agreed, so
      # nothing had broken, and nothing would have gone red on the day they
      # stopped. A comment cannot hold a rule in one place.
      - run: node --experimental-strip-types --import ./scripts/lib/ts-resolve.mjs scripts/check-child-kinds.mjs
